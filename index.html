<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>设备查询</title>
<style>
:root{
  --bg:#ffffff;--ink:#0d1117;--ink2:#4a5460;--line:#d8dee6;
  --accent:#0b62d6;--green:#0b7a45;--soft:#eef4fc;--warn:#b45309;
  --fs-base:21px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:var(--fs-base)/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;min-height:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{display:none;flex:1;flex-direction:column;padding:14px;min-height:0;overflow:hidden}
.screen.on{display:flex}

/* ---------- 查询页 ---------- */
#s1{gap:12px;justify-content:center}
.h1{font-size:29px;font-weight:800;letter-spacing:.2px;margin:0 0 2px}
.hint{font-size:18px;color:var(--ink2);margin:0}
input[type=text]{width:100%;height:68px;border:2px solid var(--line);border-radius:14px;
  padding:0 16px;font-size:28px;font-weight:700;letter-spacing:.5px;color:var(--ink);
  background:#fff;outline:none;-webkit-appearance:none}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,98,214,.12)}
.btn{height:62px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);
  font-size:21px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn[disabled]{opacity:.45}
.err{color:var(--warn);font-size:16px;font-weight:600;min-height:22px}

/* ---------- 多结果列表 ---------- */
.pick{display:flex;flex-direction:column;gap:10px;overflow:auto}
.pick button{text-align:left;padding:14px;border:2px solid var(--line);border-radius:14px;
  background:#fff;font:inherit;color:var(--ink);cursor:pointer}
.pick button b{font-size:20px}
.pick button span{display:block;font-size:17px;color:var(--ink2);margin-top:3px}

/* ---------- 详情页 ---------- */
#s2{gap:10px}
.top{display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;
  font-size:22px;line-height:1;color:var(--ink);cursor:pointer;flex:0 0 auto}
.code{font-size:24px;font-weight:800;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr;gap:8px;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:2px 0;flex:1;min-height:0;align-content:start}
.f{background:#f7f9fc;border:1px solid #e6ecf4;border-radius:12px;padding:9px 12px}
.f dt{font-size:16px;color:#3f4a57;margin:0 0 2px;font-weight:700;letter-spacing:.2px}
.f dd{margin:0;font-size:21px;font-weight:700;line-height:1.35;word-break:break-word}
.f.note{background:var(--soft);border-color:#cfe0f7}
.f.note dd{font-weight:600;white-space:pre-wrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ver{text-align:center;color:#3f4a57;font-size:16px;font-weight:600;padding:8px 0 4px;letter-spacing:.3px}
.empty{color:var(--ink2);font-size:19px}

/* ---------- 按原存放地点 ---------- */
.btn.ghost{background:#fff;color:var(--accent);border-color:var(--accent)}
.locsearch{padding:2px 0 8px;flex:0 0 auto}
.locsearch input{height:54px;font-size:20px;font-weight:600}
.locpick{display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1;min-height:0;padding:2px 0}
.locpick button{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
  padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;font:inherit;color:var(--ink);cursor:pointer}
.locpick button:active{background:#f2f6fd}
.locpick b{font-size:18px;font-weight:700;word-break:break-all}
.locpick span{font-size:15px;color:var(--ink2);flex:0 0 auto}

.devlist{display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1;min-height:0;padding:2px 0}
.devrow{background:#f7f9fc;border:1px solid #e6ecf4;border-radius:14px;padding:10px 12px;flex:0 0 auto}
.devtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.devno{font-size:14px;font-weight:800;color:var(--accent2);min-width:22px}
.devname{font-size:18px;font-weight:700;flex:1;min-width:0;word-break:break-word}
.devspec{font-size:14px;color:var(--ink2)}
.devnote{width:100%;margin-top:8px;border:2px solid var(--line);border-radius:12px;
  padding:12px 14px;font:inherit;font-size:17px;line-height:1.45;color:var(--ink);background:#fff;
  resize:vertical;min-height:88px;cursor:text;-webkit-user-select:text;user-select:text}
.devnote:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,98,214,.16);background:#fff;outline:none}
@keyframes eqpulse{0%{box-shadow:0 0 0 0 rgba(11,98,214,.55)}70%{box-shadow:0 0 0 14px rgba(11,98,214,0)}
  100%{box-shadow:0 0 0 0 rgba(11,98,214,0)}}
.devnote.pulse{border-color:var(--accent);border-width:3px;animation:eqpulse 1.2s ease-out 2}
.hintbar{margin:6px 0 0;padding:8px 12px;border-radius:10px;background:#fff6e5;border:1px solid #f0d3ae;
  color:#8a5008;font-size:16px;font-weight:700;line-height:1.35}
.hintbar[hidden]{display:none}

.devnote.editing{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,98,214,.12)}
#devTitle{white-space:normal;line-height:1.25;font-size:20px}

/* ---------- 横屏：只重排，不缩小字号 ---------- */
@media (orientation:landscape){
  :root{--fs-base:20px}
  .screen{padding:10px 14px}
  #s1{justify-content:center;gap:10px}
  .h1{font-size:25px}
  input[type=text]{height:60px;font-size:27px}
  .btn{height:52px;font-size:20px}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .f{padding:8px 12px}
  .f dt{font-size:15px}
  .f dd{font-size:20px}
  .f.wide{grid-column:1 / -1}
  .actions-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .acts{grid-template-columns:repeat(4,1fr);gap:8px}
  .code{font-size:21px}
  .back{width:44px;height:44px;font-size:22px}
  .ver{font-size:15px;padding:4px}
}
.actions-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:0 0 auto}
@media (orientation:landscape){.actions-row{grid-template-columns:repeat(4,1fr);gap:8px}}

/* ---------- 按实验室 / 场地逐台核查 ---------- */
.tag{display:inline-block;font-size:13px;font-weight:800;padding:2px 8px;border-radius:999px;
  background:#e8f0fd;color:var(--accent);border:1px solid #c7dbfa;vertical-align:middle;white-space:nowrap}
.tag.warn{background:#fdf1e3;color:var(--warn);border-color:#f0d3ae}
.pg{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding:2px 0}
.pgbar{flex:1;height:12px;border-radius:999px;background:#e7ecf3;overflow:hidden}
.pgbar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}
.pgtxt{font-size:16px;font-weight:800;color:#3f4a57;white-space:nowrap}
.ckscroll{overflow:auto;flex:1;min-height:0;padding:2px 0;-webkit-overflow-scrolling:touch}
.ckcard{background:#f7f9fc;border:1px solid #e6ecf4;border-radius:16px;padding:12px 14px}
.ckpos{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ckno{font-size:15px;font-weight:800;color:#3f4a57}
.ckname{font-size:23px;font-weight:800;line-height:1.25;word-break:break-word;flex:1;min-width:0}
.ckmeta{font-size:17px;color:var(--ink2);line-height:1.4;margin:6px 0 8px;word-break:break-word}
.ckflag{display:flex;gap:8px;flex-wrap:wrap}
.ckcard .devnote{background:#fff}
.inbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:0 0 auto}
.inbox .btn{height:66px;font-size:24px}
.inbox .btn.on{outline:4px solid rgba(11,98,214,.22)}
.inbox .btn.primary.on{outline-color:rgba(11,122,69,.3)}
.cknav3{display:grid;grid-template-columns:1fr 1.35fr 0.85fr;gap:8px;flex:0 0 auto}
.cknav3 .btn{height:56px;font-size:18px;padding:0 2px;white-space:nowrap}
#sck{gap:6px}
#sck .ver{padding:2px 0}
#sck .actions-row{grid-template-columns:repeat(4,1fr);gap:6px}
#sck .actions-row .btn{height:48px;font-size:15px;padding:0 2px;border-width:1.5px}
#sck .ckcard{padding:10px 12px}
#sck .ckname{font-size:21px}
#sck .ckmeta{font-size:16px;margin:3px 0 5px}
#sck .ckcard .devnote{margin-top:6px}
#ckTitle{white-space:normal;line-height:1.25;font-size:20px}
@media (orientation:landscape){
  .inbox .btn{height:58px;font-size:22px}
  .ckname{font-size:21px}
}
</style>
</head>
<body>

<!-- 查询 -->
<section class="screen on" id="s1">
  <h1 class="h1">查设备</h1>
  <p class="hint">输入「初始编号」，如 740-647</p>
  <input type="text" id="code" inputmode="text" autocomplete="off" autocorrect="off"
         autocapitalize="characters" spellcheck="false" placeholder="初始编号">
  <div class="err" id="err"></div>
  <button class="btn primary" id="go">查询</button>
  <button class="btn ghost" id="locBtn">按原存放地点筛选</button>
  <button class="btn ghost" id="labBtn">按实验室核查</button>
  <div class="ver count"></div>
</section>

<!-- 多结果 -->
<section class="screen" id="spick">
  <div class="top"><button class="back" id="backPick">‹</button><div class="code" id="pickTitle">找到多台，选一台</div></div>
  <div class="pick" id="pickList"></div>
  <div class="ver"></div>
</section>

<!-- 详情 -->
<section class="screen" id="s2">
  <div class="top">
    <button class="back" id="back">‹</button>
    <div class="code" id="dCode">—</div>
  </div>
  <div class="grid" id="fields"></div>
  <div class="actions-row">
    <button class="btn" id="edit">修改</button>
    <button class="btn green" id="save">保存</button>
    <button class="btn" id="dl">更新下载</button>
    <button class="btn" id="back2">返回</button>
  </div>
  <div class="ver"></div>
</section>

<!-- 原存放地点列表 -->
<section class="screen" id="sloc">
  <div class="top">
    <button class="back" id="backLoc">‹</button>
    <div class="code">按原存放地点</div>
  </div>
  <div class="locsearch"><input type="text" id="locq" placeholder="搜地点名" autocomplete="off"></div>
  <div class="locpick" id="locList"></div>
  <div class="ver"></div>
</section>

<!-- 某场地的设备列表 -->
<section class="screen" id="sdev">
  <div class="top">
    <button class="back" id="backDev">‹</button>
    <div class="code" id="devTitle">—</div>
  </div>
  <div class="hintbar" id="devHint" hidden>点下面的备注框输入</div>
  <div class="devlist" id="devList"></div>
  <div class="actions-row">
    <button class="btn" id="editAll">改备注</button>
    <button class="btn green" id="saveAll">保存</button>
    <button class="btn" id="dlAll">更新下载</button>
    <button class="btn" id="backAll">返回</button>
  </div>
  <div class="ver"></div>
</section>

<!-- 按实验室/场地核查：分组列表 -->
<section class="screen" id="slab">
  <div class="top">
    <button class="back" id="backLab">‹</button>
    <div class="code">按实验室核查</div>
  </div>
  <div class="locsearch"><input type="text" id="labq" placeholder="搜实验室或场地" autocomplete="off"></div>
  <div class="locpick" id="labList"></div>
  <div class="ver"></div>
</section>

<!-- 逐台核查 -->
<section class="screen" id="sck">
  <div class="top">
    <button class="back" id="backCk">‹</button>
    <div class="code" id="ckTitle">—</div>
  </div>
  <div class="pg"><div class="pgbar"><i id="pgFill"></i></div><div class="pgtxt" id="pgTxt">0/0 已查</div></div>
  <div class="ckscroll" id="ckScroll"></div>
  <div class="inbox">
    <button class="btn" data-act="in">在位</button>
    <button class="btn" data-act="out">不在位</button>
  </div>
  <div class="cknav3">
    <button class="btn" data-act="prev">‹ 上一台</button>
    <button class="btn primary" data-act="next">下一台 →</button>
    <button class="btn" data-act="skip">跳过</button>
  </div>
  <div class="actions-row">
    <button class="btn" id="editCk">改备注</button>
    <button class="btn green" id="saveCk">保存</button>
    <button class="btn" id="dlCk">更新下载</button>
    <button class="btn" id="backCk2">返回</button>
  </div>
  <div class="ver"></div>
</section>

/* ---------------- xlsx 导出（无依赖） ---------------- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function escXml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')}

/* ------------- xlsx 导出：以原表为模板，只改最后一列（AQ） -------------
   原表整包原样回写：styles / sharedStrings / cols / sheetViews / sheet2-3 /
   docProps / [Content_Types] / rels 全部逐字节保留，只替换有备注的那几行 AQ 单元格。 */
const TPL_FILE='设备26-模板.xlsx';
let tplCache=null;
async function templateBuf(){
  if(tplCache)return tplCache;
  const r=await fetch(TPL_FILE,{cache:'no-store'});
  if(!r.ok)throw new Error('取原表模板失败（HTTP '+r.status+'）');
  tplCache=await r.arrayBuffer();
  return tplCache;
}
function sheetRowOf(i){
  const a=DATA.rowno;
  return (a&&a.length===DATA.rows.length)?a[i]:(i+3);
}
const TDU=new TextDecoder('utf-8',{ignoreBOM:true});
function zipParse(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=-1,lim=Math.max(0,u8.length-66000);
  for(let k=u8.length-22;k>=lim;k--){
    if(u8[k]===0x50&&u8[k+1]===0x4b&&u8[k+2]===0x05&&u8[k+3]===0x06){e=k;break}
  }
  if(e<0)throw new Error('原表模板不是有效的 xlsx');
  const n=dv.getUint16(e+10,true),cds=dv.getUint32(e+16,true);
  const list=[];let p=cds;
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('原表模板的 zip 目录损坏');
    const method=dv.getUint16(p+10,true);
    const time=dv.getUint16(p+12,true),date=dv.getUint16(p+14,true);
    const crc=dv.getUint32(p+16,true),csize=dv.getUint32(p+20,true),usize=dv.getUint32(p+24,true);
    const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    const lo=dv.getUint32(p+42,true);
    const name=TDU.decode(u8.subarray(p+46,p+46+nl));
    const lnl=dv.getUint16(lo+26,true),lel=dv.getUint16(lo+28,true);
    const off=lo+30+lnl+lel;
    list.push({name:name,method:method,time:time,date:date,crc:crc,csize:csize,usize:usize,
      data:u8.subarray(off,off+csize)});
    p+=46+nl+el+cl;
  }
  return list;
}
async function deflateRaw(bytes){
  if(typeof CompressionStream==='undefined')return null;
  const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function inflateRaw(bytes){
  if(typeof DecompressionStream==='undefined')throw new Error('这台设备的浏览器不支持解压原表');
  const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
function patchAQ(xml,map){
  let out=xml,changed=0;
  for(const row in map){
    const v=map[row];
    const cell=(attrs)=>'<c r="AQ'+row+'"'+String(attrs).replace(/\st="[^"]*"/g,'')
      +' t="inlineStr"><is><t xml:space="preserve">'+escXml(v)+'</t></is></c>';
    const reEmpty=new RegExp('<c r="AQ'+row+'"([^>]*)/>');
    if(reEmpty.test(out)){out=out.replace(reEmpty,function(m,a){return cell(a)});changed++;continue}
    const reFull=new RegExp('<c r="AQ'+row+'"([^>]*)>[\\s\\S]*?</c>');
    if(reFull.test(out)){out=out.replace(reFull,function(m,a){return cell(a)});changed++}
  }
  return {xml:out,changed:changed};
}
function zipBuild(entries){
  const enc=new TextEncoder(),parts=[],dir=[];let off=0;
  for(const e of entries){
    const nm=enc.encode(e.name),data=e.data,method=e.method||0;
    const csize=(e.csize==null?data.length:e.csize);
    const usize=(e.usize==null?data.length:e.usize);
    const lh=new Uint8Array(30+nm.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);
    dv.setUint16(8,method,true);dv.setUint16(10,e.time||0,true);dv.setUint16(12,e.date||0,true);
    dv.setUint32(14,e.crc,true);dv.setUint32(18,csize,true);dv.setUint32(22,usize,true);
    dv.setUint16(26,nm.length,true);dv.setUint16(28,0,true);lh.set(nm,30);
    parts.push(lh,data);
    const ch=new Uint8Array(46+nm.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,method,true);cv.setUint16(12,e.time||0,true);cv.setUint16(14,e.date||0,true);
    cv.setUint32(16,e.crc,true);cv.setUint32(20,csize,true);cv.setUint32(24,usize,true);
    cv.setUint16(28,nm.length,true);cv.setUint32(42,off,true);ch.set(nm,46);
    dir.push(ch);off+=lh.length+data.length;
  }
  const cdSize=dir.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array(22),ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,entries.length,true);ev.setUint16(10,entries.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,off,true);
  return new Blob([...parts,...dir,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function exportXlsx(){
  const buf=await templateBuf();
  const ents=zipParse(new Uint8Array(buf));
  const map={};
  ROWS.forEach((r,i)=>{const v=noteOf(r,i);if(v)map[sheetRowOf(i)]=v});
  const out=[];
  for(const e of ents){
    if(e.name==='xl/worksheets/sheet1.xml'){
      const xml=TDU.decode(await inflateRaw(e.data));
      const patched=patchAQ(xml,map).xml;
      const raw=new TextEncoder().encode(patched);
      const comp=await deflateRaw(raw);
      if(comp&&comp.length<raw.length){
        out.push({name:e.name,method:8,time:e.time,date:e.date,
          crc:crc32(raw),csize:comp.length,usize:raw.length,data:comp});
      }else{
        out.push({name:e.name,method:0,time:e.time,date:e.date,
          crc:crc32(raw),csize:raw.length,usize:raw.length,data:raw});
      }
    }else{
      out.push(e);
    }
  }
  return zipBuild(out);
}

/* iOS 的 WebView 会忽略按钮里的程序化 focus()，不一定弹键盘。

function pulseNote(t){

function revealInBox(t,hintEl){
  const sc=t.closest('.ckscroll,.devlist');

  const r=anchor.getBoundingClientRect(),sr=sc.getBoundingClientRect();
  const want=sc.scrollTop+(r.top-sr.top)-6;
  const maxTop=Math.max(0,sc.scrollHeight-sc.clientHeight);
  sc.scrollTop=Math.max(0,Math.min(want,maxTop));
}
function focusNote(t,hintEl){
  if(!t)return;

  pulseNote(t);

    +'<div class="ckmeta">'+meta.map(esc).join(' · ')+'</div>'
    +'<div class="ckflag" id="ckFlag">'+flagHtml(i,st)+'</div>'
    +'<div class="hintbar" id="ckHint" hidden>点下面的框输入</div>'
    +'<textarea id="ckNote" class="devnote" rows="3" placeholder="后备注" enterkeyhint="done">'+esc(noteOf(r,i))+'</textarea>'
    +'</div>';
  paintActs(st);
  $('#editCk').textContent='改备注';
  $('#saveCk').disabled=!ckDirty;
}
function markStatus(st){
  const i=gIdx[gPos],r=ROWS[i],ta=$('#ckNote');
  const nv=noteWithCheck(ta?ta.value:noteOf(r,i),st);
  setNote(r,i,nv);setChk(r,i,st);
  localStorage.setItem(KEY,JSON.stringify(notes));
  if(ta)ta.value=nv;
  ckDirty=false;$('#saveCk').disabled=true;
  const f=$('#ckFlag');if(f)f.innerHTML=flagHtml(i,st);
  setBar();paintActs(st);
}
function paintActs(st){
  document.querySelectorAll('#sck [data-act=in],#sck [data-act=out]').forEach(b=>{
    const on=!!st&&b.dataset.act===(st==='在位'?'in':'out');
    b.classList.toggle('on',on);b.classList.toggle('primary',on);
  });
}
function commitNote(){
  const i=gIdx[gPos],r=ROWS[i],ta=$('#ckNote');
  if(ta){setNote(r,i,ta.value);localStorage.setItem(KEY,JSON.stringify(notes))}
  ckDirty=false;$('#saveCk').disabled=true;
}
function ckAct(a){
  if(a==='in'||a==='out'){markStatus(a==='in'?'在位':'不在位');return}
  commitNote();
  if(a==='prev'){gPos=Math.max(0,gPos-1);renderCk();return}
  if(a==='skip'){gPos=Math.min(gIdx.length-1,gPos+1);renderCk();return}
  if(a==='next'){
    let j=-1,k,idx;
    for(k=gPos+1;k<gIdx.length;k++){idx=gIdx[k];if(!isChk(ROWS[idx],idx)){j=k;break}}
    if(j<0)for(k=0;k<gIdx.length;k++){idx=gIdx[k];if(!isChk(ROWS[idx],idx)){j=k;break}}
    if(j<0){$('#pgTxt').textContent='本组已全部查完 ✓';return}
    gPos=j;renderCk();
  }
}
function toggleCkEdit(){
  focusNote($('#ckNote'),$('#ckHint'));
}
function backLab(){
  if(ckDirty&&!confirm('有未保存的备注，确定返回？'))return;
  ckDirty=false;ckEditing=false;
  renderLabs($('#labq').value);show('#slab');
}

/* 事件 */
$('#go').onclick=search;
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}});
$('#edit').onclick=()=>{editing?endEdit(false):startEdit()};
$('#save').onclick=save;
$('#dl').onclick=async()=>{
  if(editing&&dirty)save();
  if(await exportNow())flash('#dl','已下载');
};
$('#back').onclick=goBack;
$('#back2').onclick=goBack;
$('#backPick').onclick=()=>{show('#s1');setTimeout(()=>$('#code').focus(),80)};
$('#locBtn').onclick=openLocs;
$('#backLoc').onclick=()=>{show('#s1');setTimeout(()=>$('#code').focus(),80)};
$('#locq').addEventListener('input',e=>renderLocs(e.target.value));
$('#backDev').onclick=backDev;
$('#backAll').onclick=backDev;
$('#editAll').onclick=toggleDevEdit;
$('#saveAll').onclick=saveAll;
$('#dlAll').onclick=async()=>{if(dirty)saveAll();if(await exportNow())flash('#dlAll','已下载')};
$('#devList').addEventListener('input',e=>{if(e.target.classList.contains('devnote')){dirty=true;$('#saveAll').disabled=false}});
$('#devList').addEventListener('focusin',e=>{if(e.target.classList.contains('devnote'))lastNote=e.target});
$('#labBtn').onclick=openLab;
$('#backLab').onclick=()=>{show('#s1');setTimeout(()=>$('#code').focus(),80)};
$('#labq').addEventListener('input',e=>renderLabs(e.target.value));
$('#backCk').onclick=backLab;
$('#backCk2').onclick=backLab;
$('#editCk').onclick=toggleCkEdit;
$('#saveCk').onclick=()=>{commitNote();flash('#saveCk','已保存')};
$('#dlCk').onclick=async()=>{commitNote();if(await exportNow())flash('#dlCk','已下载')};
$('#sck').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(b)ckAct(b.dataset.act);
});
$('#sck').addEventListener('input',e=>{
  if(e.target.id==='ckNote'){ckDirty=true;$('#saveCk').disabled=false}
});
setTimeout(()=>$('#code').focus(),120);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>设备核查转移操作系统</title>
<style>
:root{
  --accent:#0b62d6;--accent-d:#0a52b5;--ink:#0d1117;--ink2:#4a5460;--line:#d8dee6;
  --soft:#eef4fc;--warn:#b45309;
  --pad:14px;--gap:10px;--btn-h:56px;--btn-fs:20px;--rad:14px;--fs-base:20px;
  --shadow:0 2px 8px rgba(11,98,214,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);
  font:var(--fs-base)/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;min-height:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{display:none;flex:1;flex-direction:column;padding:var(--pad);gap:var(--gap);min-height:0;overflow:hidden}
.screen.on{display:flex}

/* ---------- 按钮：一律蓝底白字 ---------- */
.btn{height:var(--btn-h);border:2px solid var(--accent);border-radius:var(--rad);
  background:var(--accent);color:#fff;font:inherit;font-size:var(--btn-fs);font-weight:700;
  line-height:1;display:flex;align-items:center;justify-content:center;text-align:center;gap:6px;
  padding:0 8px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;
  transition:background .15s,transform .08s}
.btn:active{background:var(--accent-d);border-color:var(--accent-d);transform:scale(.98);box-shadow:none}
.btn.primary,.btn.green,.btn.ghost{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[disabled]{opacity:.5}
.back{width:42px;height:42px;flex:0 0 auto;border:2px solid var(--accent);border-radius:12px;
  background:var(--accent);color:#fff;font-size:23px;line-height:1;display:flex;align-items:center;
  justify-content:center;cursor:pointer;box-shadow:var(--shadow)}
.back:active{background:var(--accent-d);border-color:var(--accent-d)}
.actions-row{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);flex:0 0 auto}
.actions-row .btn{height:calc(var(--btn-h) - 6px);font-size:clamp(14px,4.3vw,17px);padding:0 2px}

/* ---------- 查询页 ---------- */
#s1{justify-content:flex-start;padding-top:10px}
#s1 .foot{margin-top:auto}
.h1{font-size:clamp(24px,8.4vw,30px);font-weight:800;letter-spacing:1px;margin:0;line-height:1.3;
  text-align:center;color:#0b2545;white-space:nowrap}
.hint{font-size:clamp(15px,4.4vw,18px);color:var(--ink2);margin:0;text-align:center}
input[type=text]{display:block;width:calc(100% - 22px);margin:0 auto;height:clamp(50px,8.2vh,60px);
  border:2px solid var(--line);border-radius:12px;padding:0 12px;
  font-size:clamp(20px,6.2vw,26px);font-weight:700;letter-spacing:1px;color:var(--ink);
  background:#fff;outline:none;-webkit-appearance:none;text-align:center}
input[type=text]:focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(11,98,214,.35)}
/* 查询键和下面三项同宽：分组卡片内边距 10px + 边框 1px，这里补 11px 内缩，左边界一致 */
.home-acts{display:grid;grid-template-columns:1fr;gap:var(--gap);padding:0 11px}
.pickgroup{background:#f5f9ff;border:1px solid #dbe7f8;border-radius:var(--rad);padding:10px;
  display:flex;flex-direction:column;gap:8px}
.ghd{font-size:14px;font-weight:800;color:#3f5a7d;letter-spacing:.5px}
.gacts{display:grid;grid-template-columns:1fr;gap:8px}
.sacts{display:grid;grid-template-columns:1.35fr 1fr;gap:8px;flex:0 0 auto}
.ghd::before{content:'';display:inline-block;width:4px;height:14px;border-radius:2px;
  background:var(--accent);margin-right:6px;vertical-align:-2px}
.foot{font-size:12px;color:#7b8794;text-align:center;letter-spacing:.4px;font-weight:600}
/* 首页汇总块（v2.33）：数字由内嵌数据现算，别写死 */
.sumstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f5f9ff;border:1px solid #dbe7f8;
  border-radius:12px;padding:8px 10px;flex:0 0 auto}
.sst{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0}
.sst b{font-size:22px;font-weight:800;color:var(--accent);line-height:1.15;white-space:nowrap;
  letter-spacing:.2px;font-variant-numeric:tabular-nums;max-width:100%}
.sst span{font-size:12px;color:#5b6b7f;font-weight:600;line-height:1.2;white-space:nowrap}
.err{color:var(--warn);font-size:15px;font-weight:600;margin:0;text-align:center}
.err:empty{display:none}

/* ---------- 多结果 / 列表 ---------- */
.pick,.locpick{display:flex;flex-direction:column;gap:var(--gap);overflow:auto;flex:1;min-height:0;padding:2px 0}
.pick button,.locpick button{background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);
  border-radius:12px;padding:11px 14px;font:inherit;color:var(--ink);cursor:pointer;
  box-shadow:0 1px 3px rgba(13,17,23,.05)}
.pick button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
.locpick button{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.pick button:active,.locpick button:active{background:#f2f6fd}
.pick button b{font-size:18px;font-weight:800;line-height:1.3}
.pick button span{font-size:15px;color:var(--ink2)}
.locpick b{font-size:17px;font-weight:700;line-height:1.3;word-break:break-all}
.locpick span{font-size:14px;color:var(--ink2);flex:0 0 auto;font-weight:600}
.locsearch{flex:0 0 auto}
.locsearch input{width:min(100%,320px);margin:0 auto;text-align:left;height:46px;font-size:17px;font-weight:600}

/* ---------- 详情 / 明细 ---------- */
.top{display:flex;align-items:center;gap:var(--gap);flex:0 0 auto}
.code{font-size:clamp(18px,5.4vw,23px);font-weight:800;letter-spacing:.4px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr;gap:8px;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:2px 0;flex:1;min-height:0;align-content:start}
.f{background:#f7f9fc;border:1px solid #e6ecf4;border-radius:12px;padding:8px 12px}
.f dt{font-size:15px;color:#3f4a57;margin:0 0 2px;font-weight:700}
.f dd{margin:0;font-size:clamp(17px,5.2vw,21px);font-weight:700;line-height:1.35;word-break:break-word}
.f.note{background:var(--soft);border-color:#cfe0f7}
.f.note dd{font-weight:600;white-space:pre-wrap}
.ver{text-align:center;color:#607089;font-size:14px;font-weight:600;padding:4px 0 2px;letter-spacing:.2px}
.empty{color:var(--ink2);font-size:17px}

/* ---------- 备注框 ---------- */
.devnote{width:100%;margin-top:6px;border:2px solid var(--line);border-radius:12px;
  padding:10px 12px;font:inherit;font-size:17px;line-height:1.45;color:var(--ink);background:#fff;
  resize:vertical;min-height:78px;cursor:text;-webkit-user-select:text;user-select:text}
.devnote:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,98,214,.16);outline:none}
@keyframes eqpulse{0%{box-shadow:0 0 0 0 rgba(11,98,214,.55)}70%{box-shadow:0 0 0 14px rgba(11,98,214,0)}
  100%{box-shadow:0 0 0 0 rgba(11,98,214,0)}}
.devnote.pulse{border-color:var(--accent);border-width:3px;animation:eqpulse 1.2s ease-out 2}
.devnote.editing{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,98,214,.12)}
.hintbar{margin:6px 0 0;padding:7px 10px;border-radius:10px;background:#fff6e5;border:1px solid #f0d3ae;
  color:#8a5008;font-size:14px;font-weight:700;line-height:1.3}
.hintbar[hidden]{display:none}
.ckmsg{margin:6px 0 0;padding:7px 10px;border-radius:10px;background:#eaf6ec;border:1px solid #b8ddbe;
  color:#1c6b28;font-size:14px;font-weight:700;line-height:1.3}
.ckmsg.warn{background:#fff6e5;border-color:#f0d3ae;color:#8a5008}
.ckmsg[hidden]{display:none}
[hidden]{display:none!important}
.detailpane{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:2px 0}
.detailpane>.grid{overflow:visible;flex:0 0 auto;grid-template-columns:1fr}
.detailpane .devnote{margin-top:6px;background:#fff}
.dtnhint{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--ink2)}

/* ---------- 场地设备列表 ---------- */
#devTitle,#ckTitle{white-space:normal;line-height:1.25;font-size:18px}
.devlist{display:flex;flex-direction:column;gap:var(--gap);overflow:auto;flex:1;min-height:0;padding:2px 0}
.devrow{background:#f7f9fc;border:1px solid #e6ecf4;border-radius:12px;padding:9px 11px;flex:0 0 auto}
.devtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;cursor:pointer}
.devno{font-size:13px;font-weight:800;color:var(--accent);min-width:20px}
.devname{font-size:17px;font-weight:700;flex:1;min-width:0;word-break:break-word}
.devspec{font-size:13px;color:var(--ink2)}

/* ---------- 盘点录入 ---------- */

.stockout{flex:1;min-height:0;overflow:auto;font-size:16px;line-height:1.5;color:var(--ink);
  background:#f7f9fc;border:1px solid #e6ecf4;border-radius:12px;padding:10px 12px}
.stockout b{color:var(--accent)}
.stockout .miss{color:var(--warn);font-weight:700}
.small-hint{font-size:14px;color:var(--ink2);margin:0;line-height:1.35;text-align:center}

/* ---------- 逐台核查 ---------- */
.tag{display:inline-block;font-size:13px;font-weight:800;padding:2px 9px;border-radius:999px;
  background:#e8f0fd;color:var(--accent);border:1px solid #c7dbfa;vertical-align:middle;white-space:nowrap}
.tag.warn{background:#fdf1e3;color:var(--warn);border-color:#f0d3ae}
.tag[data-act]{cursor:pointer}
.pg{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.pgbar{flex:1;height:10px;border-radius:999px;background:#e7ecf3;overflow:hidden}
.pgbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.pgtxt{font-size:15px;font-weight:800;color:#3f4a57;white-space:nowrap}
.ckscroll{overflow:auto;flex:1;min-height:0;padding:2px 0;-webkit-overflow-scrolling:touch}
/* ---------- 三选一：未盘亏 / 盘亏 / 其他（v2.34） ---------- */
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.trio .opt{height:40px;min-width:0;border:2px solid var(--line);border-radius:10px;background:#fff;
  color:var(--ink);font:inherit;font-size:15px;font-weight:700;padding:0 2px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.trio .opt:active{background:#f2f6fd}
.trio .opt.on{background:#e8f0fd;border-color:var(--accent);color:var(--accent)}
.trio .opt.on::before{content:'\2713';font-size:14px;font-weight:900}
.othwrap{position:fixed;inset:0;z-index:70;background:rgba(8,16,28,.55);display:flex;
  align-items:center;justify-content:center;padding:16px}
.othbox{width:100%;max-width:260px;background:#fff;border-radius:14px;padding:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.28)}
.othtitle{font-size:15px;font-weight:800;color:var(--ink);margin:0 0 8px}
.othbox textarea{display:block;width:100%;height:78px;max-height:120px;overflow:auto;border:2px solid var(--line);
  border-radius:10px;padding:8px 10px;font:inherit;font-size:15px;line-height:1.4;resize:none;color:var(--ink);
  -webkit-user-select:text;user-select:text}
.othbox textarea:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(11,98,214,.3)}
.othacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.othacts .btn{height:40px;font-size:16px;box-shadow:none}
.dtbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.dtbar span{font-size:14px;font-weight:700;color:var(--ink2)}
.dtbar .btn{height:36px;font-size:15px;padding:0 14px;box-shadow:none}
.actions-row.three{grid-template-columns:repeat(3,1fr)}
.actions-row.two{grid-template-columns:1fr 1fr}

/* ---------- 其他不确定可备注：备注说明 + 照片记录 ---------- */
.phgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;flex:0 0 auto}
.phgrid3 .btn{height:44px;font-size:clamp(14px,4.4vw,16px);padding:0 2px;white-space:nowrap}
#phTxt{width:100%;height:92px;min-height:64px;border:2px solid var(--line);border-radius:12px;padding:9px 11px;
  font:inherit;font-size:16px;line-height:1.4;color:var(--ink);background:#fff;resize:vertical;
  -webkit-user-select:text;user-select:text;flex:0 0 auto}
#phTxt:focus{border-color:var(--accent);outline:none;box-shadow:inset 0 0 0 1px rgba(11,98,214,.35)}
.phfile{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;opacity:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;pointer-events:none}
.phlist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px 0}
.phitem{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid #e6ecf4;border-left:5px solid var(--accent);
  border-radius:12px;background:#f7f9fc;cursor:pointer}
.phthumb{width:54px;height:54px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:#e7ecf3}
.phmeta{flex:1;min-width:0}
.phnote{font-size:14px;color:var(--ink);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phtime{font-size:12px;color:#7b8794;font-weight:600}
.phwarn{flex:0 0 auto;margin:0;padding:5px 9px;border-radius:10px;background:#fff6e5;border:1px solid #f0d3ae;
  color:#8a5008;font-size:12px;line-height:1.3;font-weight:600}
/* 二次选择：底部弹出 */
.phsheet{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
  background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 -6px 28px rgba(0,0,0,.35)}
.phshtitle{font-size:14px;font-weight:800;color:#3f4a57;text-align:center;padding:2px 0 2px}
.phsheet .btn{height:48px;font-size:17px}
.phsheet .btn.cancel{background:#eef1f6;border-color:#eef1f6;color:#2d3a4b;box-shadow:none}
/* 点开大图 */
.phmodal{position:fixed;inset:0;z-index:60;background:rgba(8,16,28,.92);display:flex;flex-direction:column;
  gap:8px;padding:10px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
.phmodal img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:10px;background:#000}
.phmrow{display:flex;gap:8px}
.phmrow select{flex:0 0 38%;height:40px;border-radius:10px;border:2px solid #2f4a70;background:#12233b;color:#fff;
  font:inherit;font-size:15px;font-weight:700;padding:0 8px}
.phmrow input{flex:1;min-width:0;height:40px;border-radius:10px;border:2px solid #2f4a70;background:#12233b;color:#fff;
  font:inherit;font-size:15px;padding:0 10px}
.phmodal textarea{height:56px;border-radius:10px;border:2px solid #2f4a70;background:#12233b;color:#fff;
  font:inherit;font-size:15px;padding:8px 10px;resize:none}
.phmacts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.phmacts .btn{height:44px;font-size:16px;box-shadow:none}
/* ---------- 中等屏：挤一点 ---------- */
@media (max-height:640px){
  :root{--gap:9px;--pad:12px;--btn-h:52px;--fs-base:19px;--btn-fs:19px}
}
/* ---------- 横屏 ---------- */
@media (orientation:landscape){
  :root{--pad:10px;--gap:8px;--btn-h:44px;--btn-fs:17px;--fs-base:17px}
  #s1 .hint{display:none}
  .h1{font-size:22px;letter-spacing:2px}
  .sumstat{grid-template-columns:repeat(4,1fr);gap:5px;padding:4px 6px}
  .sst b{font-size:16px}
  .sst span{font-size:10px}
  .home-acts{grid-template-columns:1fr}
  .gacts{grid-template-columns:1fr 1fr 1fr}
  .grid{grid-template-columns:1fr 1fr}
  .f.wide{grid-column:1 / -1}
  .detailpane>.grid{grid-template-columns:1fr 1fr}
  .ver{font-size:12px;padding:2px 0}
  .back{width:38px;height:38px;font-size:20px}
  .locsearch input{height:40px;font-size:16px}
  .devnote{min-height:60px}
  .phwarn{display:none}
  #phTxt{height:56px;min-height:56px}
}
/* ---------- 横屏：核查页分两栏（左看卡片，右按按钮） ---------- */
@media (orientation:landscape){
  #sck.on{display:grid;grid-template-columns:1.08fr .92fr;
    grid-template-rows:auto auto 1fr auto;column-gap:10px;row-gap:6px}
  #sck .top{grid-column:1 / -1;grid-row:1}
  #sck .pg{grid-column:1 / -1;grid-row:2}
  #ckList{grid-column:1;grid-row:3;min-height:0}
  #ckDetail{grid-column:1;grid-row:3;min-height:0}
  #sck .actions-row{grid-column:2;grid-row:3;align-self:start}
  #sck .ver{grid-column:1 / -1;grid-row:4}
}
/* ---------- 很矮的横屏：再压一层 ---------- */
@media (orientation:landscape) and (max-height:430px){
  :root{--pad:8px;--gap:6px;--btn-h:38px;--btn-fs:15px;--fs-base:16px}
  .h1{font-size:20px}
  .actions-row .btn{font-size:14px}
  .pgbar{height:8px}
  .pgtxt{font-size:13px}
  .phgrid3 .btn{height:36px;font-size:15px}
  #phTxt{height:46px;min-height:46px;font-size:15px}
  .phitem{padding:5px 7px;gap:8px}
  .phthumb{width:44px;height:44px}
  .sumstat{padding:3px 5px;gap:4px}
  .sst b{font-size:14px}
  .sst span{font-size:9.5px}
}
/* ---------- 停用开关（v2.37）：先藏住整页，问过 status.json 再放行 ---------- */
html.gate body{visibility:hidden}
#lockScreen{position:fixed;inset:0;z-index:2147483647;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center;color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;visibility:visible}
#lockScreen h2{font-size:22px;font-weight:800;margin:0;color:#0b2545}
#lockScreen p{font-size:14px;color:#4a5460;margin:0;max-width:280px;line-height:1.6;word-break:break-word}
#lockScreen button{height:44px;min-width:120px;border-radius:12px;border:2px solid var(--accent);
  background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:700;padding:0 20px;cursor:pointer}
.ownline{font-size:11px;color:#b45309;font-weight:700}
</style>
<script>
/* 停用开关（v2.37）：整页先不可见 → 问 status.json → 放行 / 停用页。1.5 秒没答案就当未停用。 */
(function(){
  var OWNER_HASH='9ccb7b2ca7181ffedd0e6fdc840c1b32e7205831ecaf677756afeb6a00a9eb4b';
  var LK='xl2.owner', root=document.documentElement;
  root.className=(root.className?root.className+' ':'')+'gate';
  function unlock(){root.classList.remove('gate')}
  function isOwner(){try{return localStorage.getItem(LK)===OWNER_HASH}catch(e){return false}}
  function setOwner(){try{localStorage.setItem(LK,OWNER_HASH)}catch(e){}}
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
  function sha(txt){
    if(!(window.crypto&&window.crypto.subtle&&crypto.subtle.digest))return Promise.reject(new Error('no-subtle'));
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)).then(hex);
  }
  function stripParam(){
    try{
      var u=new URL(location.href);u.searchParams.delete('owner');
      var q=u.searchParams.toString();
      history.replaceState(null,'',u.pathname+(q?'?'+q:'')+u.hash);
    }catch(e){}
  }
  function whenBody(fn){if(document.body)return fn();document.addEventListener('DOMContentLoaded',fn)}
  function lock(msg){
    root.classList.add('gate');
    whenBody(function(){
      var d=document.getElementById('lockScreen');
      if(!d){
        d=document.createElement('div');d.id='lockScreen';
        d.innerHTML='<h2>本系统已停用</h2><p id="lockMsg"></p><button type="button" id="lockClose">关闭</button>';
        document.body.appendChild(d);
        d.querySelector('#lockClose').addEventListener('click',function(){try{window.close()}catch(e){}});
      }
      d.querySelector('#lockMsg').textContent=msg||'如需恢复请联系管理员。';
    });
  }
  function markOwnerLocked(){
    whenBody(function(){
      var f=document.getElementById('foot');
      if(!f||f.textContent.indexOf('仅管理员可用')>=0)return;
      f.insertAdjacentHTML('beforeend','<br><span class="ownline">已停用 · 仅管理员可用</span>');
    });
  }
  function check(){
    var q=null;
    try{q=new URLSearchParams(location.search).get('owner')}catch(e){}
    var pre=Promise.resolve();
    if(q){
      pre=sha(q).then(function(h){if(h===OWNER_HASH)setOwner()}).catch(function(){}).then(stripParam);
    }
    return pre.then(function(){
      var ctl=null;
      try{ctl=new AbortController()}catch(e){}
      var opt={cache:'no-store'};
      if(ctl)opt.signal=ctl.signal;
      var req=fetch('status.json?_='+Date.now(),opt)
        .then(function(r){if(!r.ok)throw new Error('http');return r.json()})
        .catch(function(){return null});
      /* 1.5 秒没答案就当未停用：用 race，连请求卡死（不响应 abort）也能放行 */
      var hang=new Promise(function(res){setTimeout(function(){try{ctl&&ctl.abort()}catch(e){}res(null)},1500)});
      return Promise.race([req,hang]);
    }).then(function(j){
      if(!j)return unlock();                       /* 404 / 断网 / JSON 坏 → 当未停用 */
      if(j.locked!==true)return unlock();          /* 没锁 → 正常 */
      if(isOwner()){unlock();markOwnerLocked();return}  /* 自己人：照用，页脚加一行 */
      lock(j.msg);
    });
  }
  window.__eqGate={check:check,lock:lock,unlock:unlock,isOwner:isOwner,hash:OWNER_HASH};
  check();
  window.addEventListener('pageshow',function(e){if(e.persisted)check()});
})();
</script>

/* ---------------- xlsx 导出（无依赖） ---------------- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function escXml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')}

/* ------------- xlsx 导出：以原表为模板，只改「盘盈/盘亏」列（S） -------------
   原表整包原样回写：styles / sharedStrings / cols / sheetViews / sheet2-3 /
   docProps / [Content_Types] / rels 全部逐字节保留，只替换标注动过的那几行 S 单元格。 */
const TPL_FILE='台账模板.xlsx';
let tplCache=null;
async function templateBuf(){
  if(tplCache)return tplCache;
  const r=await fetch(TPL_FILE,{cache:'no-store'});
  if(!r.ok)throw new Error('取原表模板失败（HTTP '+r.status+'）');
  tplCache=await r.arrayBuffer();
  return tplCache;
}
function sheetRowOf(i){
  const a=DATA.rowno;
  return (a&&a.length===DATA.rows.length)?a[i]:(i+3);
}
const TDU=new TextDecoder('utf-8',{ignoreBOM:true});
function zipParse(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=-1,lim=Math.max(0,u8.length-66000);
  for(let k=u8.length-22;k>=lim;k--){
    if(u8[k]===0x50&&u8[k+1]===0x4b&&u8[k+2]===0x05&&u8[k+3]===0x06){e=k;break}
  }
  if(e<0)throw new Error('原表模板不是有效的 xlsx');
  const n=dv.getUint16(e+10,true),cds=dv.getUint32(e+16,true);
  const list=[];let p=cds;
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('原表模板的 zip 目录损坏');
    const method=dv.getUint16(p+10,true);
    const time=dv.getUint16(p+12,true),date=dv.getUint16(p+14,true);
    const crc=dv.getUint32(p+16,true),csize=dv.getUint32(p+20,true),usize=dv.getUint32(p+24,true);
    const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    const lo=dv.getUint32(p+42,true);
    const name=TDU.decode(u8.subarray(p+46,p+46+nl));
    const lnl=dv.getUint16(lo+26,true),lel=dv.getUint16(lo+28,true);
    const off=lo+30+lnl+lel;
    list.push({name:name,method:method,time:time,date:date,crc:crc,csize:csize,usize:usize,
      data:u8.subarray(off,off+csize)});
    p+=46+nl+el+cl;
  }
  return list;
}
async function deflateRaw(bytes){
  if(typeof CompressionStream==='undefined')return null;
  const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function inflateRaw(bytes){
  if(typeof DecompressionStream==='undefined')throw new Error('这台设备的浏览器不支持解压原表');
  const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
function patchS(xml,map){
  let out=xml,changed=0;
  for(const row in map){
    const v=map[row];
    const reSelf=new RegExp('<c r="S'+row+'"([^>]*)/>');
    const reFull=new RegExp('<c r="S'+row+'"([^>]*)>[\\s\\S]*?</c>');
    if(v===''){
      /* 页面里被清空：模板原本有内容的，就改回自闭合空 cell，保留 s 等属性 */
      if(reSelf.test(out))continue;   // 本来就是空 cell，不动
      const m=reFull.exec(out);
      if(m){
        out=out.replace(reFull,function(x,a){return '<c r="S'+row+'"'+String(a).replace(/\st="[^"]*"/g,'')+'/>'});
        changed++;
      }
      continue;
    }
    const cell=(attrs)=>'<c r="S'+row+'"'+String(attrs).replace(/\st="[^"]*"/g,'')
      +' t="inlineStr"><is><t xml:space="preserve">'+escXml(v)+'</t></is></c>';
    if(reSelf.test(out)){out=out.replace(reSelf,function(m,a){return cell(a)});changed++;continue}
    if(reFull.test(out)){out=out.replace(reFull,function(m,a){return cell(a)});changed++}
  }
  return {xml:out,changed:changed};
}
function zipBuild(entries){
  const enc=new TextEncoder(),parts=[],dir=[];let off=0;
  for(const e of entries){
    const nm=enc.encode(e.name),data=e.data,method=e.method||0;
    const csize=(e.csize==null?data.length:e.csize);
    const usize=(e.usize==null?data.length:e.usize);
    const flag=/[^\x00-\x7F]/.test(e.name)?0x0800:0;   /* 中文文件名：置 UTF-8 标记位，免得解压乱码 */
    const lh=new Uint8Array(30+nm.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,flag,true);
    dv.setUint16(8,method,true);dv.setUint16(10,e.time||0,true);dv.setUint16(12,e.date||0,true);
    dv.setUint32(14,e.crc,true);dv.setUint32(18,csize,true);dv.setUint32(22,usize,true);
    dv.setUint16(26,nm.length,true);dv.setUint16(28,0,true);lh.set(nm,30);
    parts.push(lh,data);
    const ch=new Uint8Array(46+nm.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,flag,true);cv.setUint16(10,method,true);cv.setUint16(12,e.time||0,true);cv.setUint16(14,e.date||0,true);
    cv.setUint32(16,e.crc,true);cv.setUint32(20,csize,true);cv.setUint32(24,usize,true);
    cv.setUint16(28,nm.length,true);cv.setUint32(42,off,true);ch.set(nm,46);
    dir.push(ch);off+=lh.length+data.length;
  }
  const cdSize=dir.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array(22),ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,entries.length,true);ev.setUint16(10,entries.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,off,true);
  return new Blob([...parts,...dir,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function exportXlsx(){
  const buf=await templateBuf();
  const ents=zipParse(new Uint8Array(buf));
  const map={};
  /* 只写「动过的行」：没动过的行保持模板原样（仍然是无盘亏） */
  ROWS.forEach((r,i)=>{const k=rkey(r,i);if(k in notes)map[sheetRowOf(i)]=notes[k]});
  const out=[];
  for(const e of ents){
    if(e.name==='xl/worksheets/sheet1.xml'){
      const xml=TDU.decode(await inflateRaw(e.data));
      const patched=patchS(xml,map).xml;
      const raw=new TextEncoder().encode(patched);
      const comp=await deflateRaw(raw);
      if(comp&&comp.length<raw.length){
        out.push({name:e.name,method:8,time:e.time,date:e.date,
          crc:crc32(raw),csize:comp.length,usize:raw.length,data:comp});
      }else{
        out.push({name:e.name,method:0,time:e.time,date:e.date,
          crc:crc32(raw),csize:raw.length,usize:raw.length,data:raw});
      }
    }else{
      out.push(e);
    }
  }
  return zipBuild(out);
}
async function exportNow(){
  const n=Object.keys(notes).length;
  if(!n&&!confirm('现在一条备注都没有，导出的表和原表一样。先去核查页给设备点「未盘亏」或填盘盈/盘亏，再来下载。仍要下载吗？')){
    return false;
  }
  try{
    const blob=await exportXlsx();
    download(blob,'男生宿舍楼1-小二楼-带标注-'+stamp()+'.xlsx');
    return true;
  }catch(err){
    alert('导出失败：'+((err&&err.message)||err)
      +'\n\n要能读取同目录的「'+TPL_FILE+'」。请通过网址打开本页，不能直接双击本地文件。');
    return false;
  }
}
function download(blob,name){
  const a=document.createElement('a'),u=URL.createObjectURL(blob);
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ---------------- 按所属专业（v2.26 起；原来按现存放位置） ---------------- */
const NO_PROF='（未填专业）';
const profMap={};
ROWS.forEach((r,i)=>{const v=get(r,'所属专业').trim()||NO_PROF;(profMap[v]=profMap[v]||[]).push(i)});
/* 台数多的在前；「（未填专业）」永远排最后 */
const PROFS=Object.keys(profMap).sort((a,b)=>{
  if(a===NO_PROF)return 1;
  if(b===NO_PROF)return -1;
  if(a==='无')return 1;
  if(b==='无')return -1;
  return profMap[b].length-profMap[a].length||a.localeCompare(b,'zh-Hans-CN');
});

function renderProfs(q){
  const kw=(q||'').trim();
  const list=PROFS.filter(v=>!kw||v.includes(kw));
  $('#locList').innerHTML=list.length?list.map(v=>
    '<button data-l="'+esc(v)+'"><b>'+esc(v)+'</b><span>'+profMap[v].length+' 台</span></button>').join('')
    :'<div class="empty">没找到这个专业</div>';
  $('#locList').querySelectorAll('button').forEach(b=>b.onclick=()=>openProfLoc(b.dataset.l));
}
function openProfs(){
  $('#locq').value='';renderProfs('');
  show('#sloc');
}
/* 某个专业下面的场地：台数降序，未填的场地垫底 */
const NO_LOC='（未填存放位置）';
const locOf=i=>get(ROWS[i],'存放地点').trim()||NO_LOC;
function profLocs(prof){
  const m={};
  (profMap[prof]||[]).forEach(i=>{const v=locOf(i);(m[v]=m[v]||[]).push(i)});
  return Object.keys(m).sort((a,b)=>{
    if(a===NO_LOC)return 1;if(b===NO_LOC)return -1;
    return m[b].length-m[a].length||a.localeCompare(b,'zh-Hans-CN');
  }).map(k=>[k,m[k]]);
}
function renderProfLocs(){
  const kw=($('#plocq').value||'').trim();
  const list=profLocs(curProf).filter(x=>!kw||x[0].includes(kw));
  $('#plocList').innerHTML=list.length?list.map(x=>{
    const k=x[0],n=x[1].length;
    const tag='<span class="tag" style="background:#eef1f6;color:#4a5460;border-color:#d8dee6">场地</span>';
    return '<button data-l="'+esc(k)+'"><b>'+esc(k)+' '+tag+'</b><span>'+n+' 台</span></button>';
  }).join(''):'<div class="empty">没找到这个场地</div>';
  $('#plocList').querySelectorAll('button').forEach(b=>b.onclick=()=>openProfDev(curProf,b.dataset.l));
}

/* ---------- 三选一：未盘亏 / 盘亏 / 其他（专业进、场地进共用同一套，同一份 notes） ---------- */
const OPT_IN='未盘亏', OPT_OUT='盘亏';
/* 盘盈/盘亏里写的是什么结论：新写法「未盘亏」「盘亏」与老写法「无盘亏」「核查 日期 盘亏」一起认 */
function noteConclusion(note){
  const lines=String(note==null?'':note).split('\n').map(l=>l.trim());
  if(lines.some(l=>l==='无盘亏'||l==='未盘亏'))return OPT_IN;
  if(lines.some(l=>l==='盘亏'||/^核查 \d{4}-\d{2}-\d{2} (在位|不在位|未盘亏|盘亏)$/.test(l)))return OPT_OUT;
  return '';
}
/* 显示用：三个选项谁被选中；不是结论的字一律落在「其他」 */
function selFromNote(note){
  const t=String(note==null?'':note).trim();
  if(!t)return {v:'',txt:''};
  const c=noteConclusion(t);
  if(c)return {v:c,txt:''};
  return {v:'other',txt:t};
}
/* 保存时真正写进「盘盈/盘亏」的字：未盘亏 / 盘亏 / 其他那段原文 */
function noteForSel(sel){
  if(!sel||!sel.v)return '';
  if(sel.v===OPT_IN)return OPT_IN;
  if(sel.v===OPT_OUT)return OPT_OUT;
  return String(sel.txt==null?'':sel.txt).trim();
}
const pending={};                 /* i → {v,txt}：界面上选好了、还没点「保存」 */
function selOf(i){return pending[i]||selFromNote(noteOf(ROWS[i],i))}

  return '<div class="trio">'+one(OPT_IN,OPT_IN)+one(OPT_OUT,OPT_OUT)+one('other','其他')+'</div>';
}

/* ---------------- 其他不确定可备注：备注说明（localStorage）+ 照片记录（IndexedDB） ---------------- */
const PH_DB='xl2.photos', PH_STORE='recs';
const PHP_DRAFT='xl2.photo.draft.v1', PHP_HIST='xl2.photo.hist.v1';
let phDBP=null, phURLs=[], phMem=[], phMemMode=false;
const phSession=new Set();          /* 本次打开页面后新加的照片 id，用于「单独导出」 */
let phSessionStart=Date.now();

function phOpenDB(){
  if(phDBP)return phDBP;
  phDBP=new Promise((res,rej)=>{
    let rq;
    try{rq=indexedDB.open(PH_DB,1)}catch(e){rej(e);return}
    rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains(PH_STORE))db.createObjectStore(PH_STORE,{keyPath:'id'})};
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error||new Error('打开本地相册失败'));
  });
  return phDBP;
}
function phStore(mode){return phOpenDB().then(db=>db.transaction(PH_STORE,mode).objectStore(PH_STORE))}
function phUseMem(reason){
  if(!phMemMode){phMemMode=true;console.warn('照片存储降到内存：',reason)}
}
async function phAll(){
  if(phMemMode)return phMem.slice();
  try{
    const st=await phStore('readonly');
    return await new Promise((res,rej)=>{const r=st.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});
  }catch(e){phUseMem(e);return phMem.slice()}
}
async function phPut(rec){
  if(phMemMode){phMem=phMem.filter(r=>r.id!==rec.id).concat([rec]);return}
  try{
    const st=await phStore('readwrite');
    await new Promise((res,rej)=>{const r=st.put(rec);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  }catch(e){phUseMem(e);phMem=phMem.filter(r=>r.id!==rec.id).concat([rec])}
}
async function phDelete(id){
  if(phMemMode){phMem=phMem.filter(r=>r.id!==id);return}
  try{
    const st=await phStore('readwrite');
    await new Promise((res,rej)=>{const r=st.delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  }catch(e){phUseMem(e);phMem=phMem.filter(r=>r.id!==id)}
}
const phId=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);
const phP2=n=>String(n).padStart(2,'0');
const phTime=t=>{const d=new Date(t);return phP2(d.getMonth()+1)+'-'+phP2(d.getDate())+' '+phP2(d.getHours())+':'+phP2(d.getMinutes())};
const phStamp=t=>{const d=new Date(t);return d.getFullYear()+phP2(d.getMonth()+1)+phP2(d.getDate())+'-'+phP2(d.getHours())+phP2(d.getMinutes())};

/* ---- 照片 ---- */
function phPickImg(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{URL.revokeObjectURL(u);res(img)};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('这张图打不开'))};
    img.src=u;
  });
}
async function phCompress(file){
  const img=await phPickImg(file);
  const max=1600;
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  const k=Math.min(1,max/Math.max(iw,ih));
  const w=Math.max(1,Math.round(iw*k)),h=Math.max(1,Math.round(ih*k));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  cv.getContext('2d').drawImage(img,0,0,w,h);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
  return blob||file;
}
async function phAddFiles(list){
  try{
    const arr=[...list].filter(f=>f&&f.type&&/^image\//.test(f.type));
    if(!arr.length){alert('没拿到图片，重试一次或改用相册');return}
    if(!window.indexedDB)phUseMem('no indexedDB');
    const note=($('#phTxt').value||'').trim();
    let n=0,base=Date.now(),lastErr='';
    for(const f of arr){
      let blob=f;
      try{blob=await phCompress(f)}catch(e){lastErr=e&&e.message||String(e)}
      const rec={id:phId()+'-'+n,note,time:base+n*1000,img:blob};
      try{await phPut(rec);phSession.add(rec.id);n++}
      catch(e){lastErr=e&&e.message||String(e)}
    }
    await phRender();
    if(!n){alert('没能存下这张照片：'+(lastErr||'原因不明'));return}
    const lb=$('#phAdd'),old=lb.textContent;
    lb.textContent='已存 '+n+' 张';
    setTimeout(()=>{lb.textContent=old},1200);
  }catch(e){alert('加照片出错：'+(e&&e.message||e))}
}
let phRenderSeq=0;
async function phRender(){
  const seq=++phRenderSeq;
  const recs=(await phAll()).sort((a,b)=>b.time-a.time);
  if(seq!==phRenderSeq)return;          /* 有更新的渲染在跑，这次丢弃，免得两头像互相撤 URL */
  const old=phURLs;phURLs=[];
  if(!recs.length){
    $('#phList').innerHTML='<div class="empty">还没有照片，点「拍照/相册」加一张</div>';
    old.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});
    return;
  }
  const html=recs.map(r=>{
    const u=URL.createObjectURL(r.img);phURLs.push(u);
    return '<div class="phitem" data-id="'+esc(r.id)+'">'
      +'<img class="phthumb" src="'+u+'" alt="">'
      +'<div class="phmeta"><span class="phtime">'+phTime(r.time)+'</span>'
      +'<div class="phnote">'+esc((r.note||'（无备注说明）').slice(0,30))+'</div></div></div>';
  }).join('');
  $('#phList').innerHTML=html;
  $('#phList').querySelectorAll('.phitem').forEach(el=>el.onclick=()=>phDetail(el.dataset.id));
  /* 先换上新图再撤销旧 URL，避免正显示的那张被打断 */
  old.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});
}
async function phDetail(id){
  const recs=await phAll();const r=recs.find(x=>x.id===id);if(!r)return;
  const u=URL.createObjectURL(r.img);
  const m=document.createElement('div');m.className='phmodal';m.id='phModal';
  m.innerHTML='<img src="'+u+'" alt="">'

    +'<div class="phmacts"><button class="btn" id="phmSave">保存</button>'
    +'<button class="btn" id="phmDel">删除这张</button>'
    +'<button class="btn cancel" id="phmClose">关闭</button></div>';
  document.body.appendChild(m);
  const close=()=>{try{URL.revokeObjectURL(u)}catch(e){};m.remove();phRender()};
  $('#phmClose').onclick=close;

    await phDelete(r.id);phSession.delete(r.id);close();
  };
}
function phDos(ms){
  const d=new Date(ms);
  const time=(((d.getHours()&31)<<11)|((d.getMinutes()&63)<<5)|((d.getSeconds()/2)|0))&0xFFFF;
  const date=((((d.getFullYear()-1980)&127)<<9)|(((d.getMonth()+1)&15)<<5)|(d.getDate()&31))&0xFFFF;
  return {time,date};
}
const phSafe=s=>String(s||'').replace(/[\\/:*?"<>|\s]+/g,'').slice(0,20);
const phCsv=v=>{const t=String(v==null?'':v);return /[",\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
async function phExportZip(mode){
  const all=(await phAll()).sort((a,b)=>b.time-a.time);
  const recs=(mode==='session')?all.filter(r=>phSession.has(r.id)):all;
  if(!recs.length){alert(mode==='session'?'这次还没有新加的照片':'还没有照片，先拍一张再导出');return}
  const ents=[],rows=[['备注','文件名','时间']];
  for(let k=0;k<recs.length;k++){
    const r=recs[k];
    const nm='photos/'+String(k+1).padStart(3,'0')+'_'+phStamp(r.time)+'.jpg';
    const buf=new Uint8Array(await r.img.arrayBuffer());
    const dt=phDos(r.time);
    ents.push({name:nm,method:0,time:dt.time,date:dt.date,data:buf,crc:crc32(buf),csize:buf.length,usize:buf.length});
    rows.push([r.note||'',nm,new Date(r.time).toLocaleString('zh-CN')]);
  }
  const csv='\ufeff'+rows.map(r=>r.map(phCsv).join(',')).join('\r\n');
  const cb=new TextEncoder().encode(csv);
  const dd=phDos(Date.now());
  ents.push({name:'备注.csv',method:0,time:dd.time,date:dd.date,data:cb,crc:crc32(cb),csize:cb.length,usize:cb.length});
  const raw=await zipBuild(ents).arrayBuffer();
  download(new Blob([raw],{type:'application/zip'}),'账外记录-'+phStamp(Date.now())+'.zip');
}
async function phClearPics(){

}
/* ---- 二次选择：底部弹出（拍照/相册用 <label for> 原生唤起，iOS 才弹得出来） ---- */
function phMenu(title,items){
  const m=document.createElement('div');m.className='phmodal';m.id='phMenu';
  m.innerHTML='<div class="phsheet"><div class="phshtitle">'+esc(title)+'</div>'
    +items.map((it,i)=>it.for
      ?'<label class="btn" for="'+it.for+'" data-i="'+i+'">'+esc(it.label)+'</label>'
      :'<button class="btn" data-i="'+i+'">'+esc(it.label)+'</button>').join('')
    +'<button class="btn cancel" data-i="-1">取消</button></div>';
  document.body.appendChild(m);
  m.querySelectorAll('[data-i]').forEach(el=>{
    el.onclick=()=>{
      const i=+el.dataset.i;
      /* label 要点：先删掉面板，label 已不在文档里，浏览器就不再跑它的默认动作（唤起 input[type=file]），
         表现就是点了没反应。所以 label 必须让默认动作先走，再异步收面板。 */
      if(el.tagName==='LABEL'){
        setTimeout(()=>{if(document.body.contains(m))m.remove()},0);
        return;
      }
      m.remove();
      setTimeout(()=>{if(i>=0&&items[i]&&items[i].act)items[i].act()},10);
    };
  });
  m.onclick=e=>{if(e.target===m)m.remove()};
}

/* 字多的地方（大标题、长按钮）：按实际宽度缩字号，保证不换行、不截断 */
function fitOne(el,min){
  if(!el)return;
  el.style.fontSize='';
  let fs=parseFloat(getComputedStyle(el).fontSize)||20,guard=0;
  while(el.scrollWidth>el.clientWidth&&fs>(min||10)&&guard++<60){fs-=0.5;el.style.fontSize=fs.toFixed(1)+'px'}
}
function fitTexts(){
  fitOne($('#h1'),14);
  fitOne($('#stockBtn'),10);
  fitOne($('#go'),12);
  ['#ssTotal','#ssMoney','#ssProf','#ssLab'].forEach(s=>fitOne($(s),13));
}
/* 首页汇总块（v2.33）：四个数全部从内嵌数据现算，换母表自动跟着走，别写死 */
function renderSum(){
  let money=0;
  const profs=new Set(), locs=new Set();
  ROWS.forEach(r=>{
    const v=parseFloat(get(r,'账面价值').replace(/[^0-9.]/g,''));
    if(isFinite(v))money+=v;
    const p=get(r,'所属专业').trim();
    if(p&&p!=='无')profs.add(p);
    const l=get(r,'存放地点').trim();
    if(l)locs.add(l);
  });
  const set=(s,t)=>{const el=$(s);if(el)el.textContent=t};
  set('#ssTotal',ROWS.length+' 台');
  set('#ssMoney','¥'+(money/10000).toFixed(1)+' 万');
  set('#ssProf',profs.size+' 个');
  set('#ssLab',locs.size+' 个');
}
